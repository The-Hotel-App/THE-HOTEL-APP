name: Build & Release APK

on:
  push:
    branches: [main, master]
    paths:
      - "rooms_app/lib/**"
      - "rooms_app/pubspec.yaml"
      - "rooms_app/android/**"
      - ".github/workflows/**"

permissions:
  contents: write
  actions: write

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rooms_app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            rooms_app/.dart_tool
          key: pub-${{ hashFiles('rooms_app/pubspec.lock') }}
          restore-keys: pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            rooms_app/android/.gradle
            rooms_app/build
          key: gradle-${{ hashFiles('rooms_app/android/**/*.gradle*', 'rooms_app/pubspec.lock') }}
          restore-keys: gradle-

      - name: Get dependencies
        run: flutter pub get

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Build APK (all ABIs)
        run: |
          flutter build apk --split-per-abi --release \
            --no-tree-shake-icons \
            --suppress-analytics

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d '\r')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION-$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.version }}
          files: rooms_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup Old Releases (Keep Latest Only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get all releases sorted by creation date (newest first)
          RELEASES=$(gh release list --repo ${{ github.repository }} --limit 100 --json tagName,createdAt --jq '.[1:] | .[].tagName')

          for TAG in $RELEASES; do
            echo "Deleting release: $TAG"
            gh release delete "$TAG" --repo ${{ github.repository }} --yes --cleanup-tag || true
          done

      - name: Cleanup Old Workflow Runs (Keep Latest Only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get all completed workflow runs for this workflow (skip the current one)
          CURRENT_RUN_ID=${{ github.run_id }}

          # Get workflow runs, skip the first one (current/latest)
          RUNS=$(gh run list --workflow=build-apk.yml --repo ${{ github.repository }} --limit 100 --json databaseId,status --jq ".[] | select(.databaseId != $CURRENT_RUN_ID) | .databaseId")

          for RUN_ID in $RUNS; do
            echo "Deleting workflow run: $RUN_ID"
            gh run delete "$RUN_ID" --repo ${{ github.repository }} || true
          done
