name: rooms
description: "ROOMS.io - Hotel Internal Operations Mobile App"
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Storage
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.2

  # Backend & Database
  supabase_flutter: ^2.8.0

  # Push Notifications
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6

  # Network
  dio: ^5.7.0

  # UI & Utilities
  intl: ^0.20.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Forms
  flutter_form_builder: 10.2.0
  form_builder_validators: ^11.0.0

  # Biometrics (prepared for future)
  local_auth: ^2.3.0

  # Image handling (for ID photos)
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # URL handling (for update dialog)
  url_launcher: ^6.3.1

  # Package info (for version detection)
  package_info_plus: ^8.1.0

  # OCR for Aadhaar card
  google_mlkit_text_recognition: ^0.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.2
  freezed: ^2.5.7
  json_serializable: ^6.8.0

  # App icon and splash screen generation
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/new_images/yellow_logo_on_transparent_bg.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/new_images/yellow_logo_on_transparent_bg.png"

flutter_native_splash:
  color: "#000000"
  image: assets/new_images/white_logo_on_black_bg.png
  android: true
  ios: false
  android_12:
    color: "#000000"
    image: assets/new_images/white_logo_on_black_bg.png

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/new_images/
